services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: backend
      DB_USERNAME: backend
      DB_PASSWORD: backend_dev
      DB_TEST_DATABASE: backend_test
      DB_TEST_USERNAME: backend_test
      DB_TEST_PASSWORD: backend_test_dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - vendor:/app/vendor
    command:
      - sh
      - -c
      - |
        set -e
        composer install --no-interaction --prefer-dist
        composer migrate --no-interaction
        exec php -S 0.0.0.0:8000 -t public

  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --default-time-zone=+00:00
      - --skip-log-bin
    environment:
      MYSQL_DATABASE: backend
      MYSQL_USER: backend
      MYSQL_PASSWORD: backend_dev
      MYSQL_ROOT_PASSWORD: root_dev
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql/init-test.sql:/docker-entrypoint-initdb.d/01-init-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  vendor:
  mysql:
